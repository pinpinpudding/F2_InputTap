name: Build Windows VST3

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item -Recurse build/F2_InputTap_artefacts/Release/VST3/F2_InputTap.vst3 package/
          # readme.txt: CRLF + UTF-8 BOM so it opens correctly in any Notepad
          $text = (Get-Content -Raw -Encoding utf8 "dist/readme.txt") -replace "`r?`n", "`r`n"
          [IO.File]::WriteAllText("$PWD/package/readme.txt", $text, [Text.UTF8Encoding]::new($true))

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: F2_InputTap-v1.1.0-Windows-x64
          path: package/

      # Publish the zip on the repository's Releases page (simple, permanent download link)
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.1.0"
          $zip = "F2_InputTap-$tag-Windows-x64.zip"
          Compress-Archive -Path package/* -DestinationPath $zip -Force
          $title = "F2_Input_Tap $tag"
          $notes = "dist/release-notes.md"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber
            gh release edit $tag --title $title --notes-file $notes
          } else {
            gh release create $tag $zip --title $title --notes-file $notes
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }

          # Remove any other (old) files from this release so only the current zip remains
          $assets = gh release view $tag --json assets --jq '.assets[].name'
          foreach ($a in $assets) {
            if ($a -ne $zip) {
              Write-Host "Deleting old release file: $a"
              gh release delete-asset $tag $a --yes
            }
          }
          exit 0
